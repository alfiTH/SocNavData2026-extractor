services:
  ros_container:
    # 1. BUILD THE DOCKER IMAGE
    build: 
      context: ./docker
      dockerfile: Dockerfile 
    
    container_name: ros_container
    network_mode: "host"
    ipc: host
    privileged: true
    
    # 2. GPU SUPPORT (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              #ADDED: 'video' and 'compute' to ensure hardware acceleration
              capabilities: [gpu, video, compute, utility]
              
    # 3. ENVIRONMENT VARIABLES FOR GRAPHICAL INTERFACE (RViz/Gazebo)
    environment:
      #- HOME=/tmp
      - DISPLAY=:1
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - LIBGL_ALWAYS_SOFTWARE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    #user: "1000:1000"
    # 4. MAPPING THE WORKSPACE FOLDER (Host <-> Container)
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/root/catkin_ws
      - ./experiments:/root/experiments
      - ./NavWareSet_parse:/root/NavWareSet_parse
      
    command: /bin/bash
    tty: true
    stdin_open: true

